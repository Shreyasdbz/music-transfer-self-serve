<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Apple Music</title>
    <!-- MusicKit JS v3. The dev token configured below is short-lived (10 min,
         §11.0); the long-lived 180-day token never leaves the server. -->
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async></script>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; color: #222426; padding: 2rem; }
      main { max-width: 28rem; margin: 0 auto; }
      button { font: inherit; padding: 0.5em 1em; border-radius: 8px; border: 1px solid #e8e8e8; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #message { color: #b58900; }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect Apple Music</h1>
      <p id="status">Loading MusicKit…</p>
      <button id="authorize" type="button" disabled>Authorize</button>
      <p id="message"></p>
    </main>
    <script type="module">
      const statusEl = document.getElementById("status");
      const msgEl = document.getElementById("message");
      const btn = document.getElementById("authorize");
      const setStatus = (t) => (statusEl.textContent = t);
      const setError = (t) => (msgEl.textContent = t);

      // CSRF: the <meta> injection (prod, Hono-served) or /api/csrf (dev, Vite-served).
      async function getCsrf() {
        const meta = document.querySelector('meta[name="csrf-token"]')?.content;
        if (meta) return meta;
        try {
          const r = await fetch("/api/csrf");
          if (r.ok) return (await r.json()).csrfToken;
        } catch (_) {}
        return "";
      }
      const csrfToken = await getCsrf();
      if (!csrfToken) setError("CSRF token missing — refresh the parent window and try again.");

      let developerToken, nonce, appName;
      try {
        const r = await fetch("/api/auth/apple/start", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
        });
        if (!r.ok) throw new Error(`server returned ${r.status}: ${await r.text()}`);
        ({ developerToken, nonce, appName } = await r.json());
      } catch (err) {
        setError(`Could not get developer token: ${err.message}`);
        setStatus("Failed");
        throw err;
      }

      await new Promise((resolve) => {
        if (window.MusicKit) return resolve();
        document.addEventListener("musickitloaded", () => resolve(), { once: true });
      });

      try {
        await window.MusicKit.configure({
          developerToken,
          app: { name: appName ?? "music-transfer-self-serve", build: "0.2.0" },
        });
        setStatus("Ready. Click Authorize.");
        btn.disabled = false;
      } catch (err) {
        setError(`MusicKit.configure failed: ${err.message}`);
        setStatus("Failed");
        throw err;
      }

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        setStatus("Waiting for Apple Music authorization…");
        try {
          const mut = await window.MusicKit.getInstance().authorize();
          if (!mut) throw new Error("authorize() returned an empty Music-User-Token");
          const r = await fetch("/api/auth/apple/callback", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken },
            body: JSON.stringify({ nonce, mut }),
          });
          if (!r.ok) throw new Error(`callback returned ${r.status}: ${await r.text()}`);
          setStatus("Apple Music connected. You can close this window.");
          setTimeout(() => { try { window.close(); } catch (_) {} }, 400);
        } catch (err) {
          setError(`Authorize failed: ${err.message}`);
          setStatus("Failed");
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
