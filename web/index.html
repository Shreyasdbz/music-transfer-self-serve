<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>music-transfer-self-serve</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <h1>music-transfer-self-serve</h1>
      <p class="subtitle">Local web tool · additive transfers · Spotify ⇄ Apple Music</p>
    </header>

    <main>
      <section id="auth-panel" class="panel">
        <h2>Auth status</h2>
        <div class="auth-row">
          <span class="auth-label">Spotify</span>
          <span id="spotify-status" class="auth-status">…</span>
          <button id="spotify-connect" type="button">Connect Spotify</button>
        </div>
        <div class="auth-row">
          <span class="auth-label">Apple Music</span>
          <span id="apple-status" class="auth-status">…</span>
          <button id="apple-connect" type="button">Connect Apple Music</button>
        </div>
        <p id="auth-message" class="auth-message"></p>
      </section>

      <section id="permissions-panel" class="panel">
        <h2>Permissions</h2>
        <div class="panel-actions">
          <button id="check-permissions" type="button">Check permissions</button>
          <span id="preflight-summary" class="muted"></span>
        </div>
        <div id="gate-banner" class="gate-banner" hidden></div>
        <div id="preflight-groups">
          <div class="check-group" data-group="env">
            <h3>Environment</h3>
            <ul></ul>
          </div>
          <div class="check-group" data-group="spotify">
            <h3>Spotify</h3>
            <ul></ul>
          </div>
          <div class="check-group" data-group="apple">
            <h3>Apple</h3>
            <ul></ul>
          </div>
        </div>
      </section>

      <section id="catalog-panel" class="panel">
        <h2>Catalog</h2>
        <div class="panel-actions">
          <button id="update-catalog" type="button" disabled>Update Catalog</button>
          <span id="catalog-status" class="muted"></span>
        </div>
      </section>

      <section id="operation-panel" class="panel">
        <h2>Operation</h2>
        <p class="muted">The Operation form lands in Phase 6 / 7.</p>
        <div class="panel-actions">
          <button id="run-operation" type="button" disabled>Run</button>
          <span id="operation-status" class="muted"></span>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
